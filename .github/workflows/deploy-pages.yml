name: Deploy to GitHub Pages

# 来源：GitHub Pages 官方自定义工作流方案：
# https://docs.github.com/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run verify:models
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      # enablement: true 让本工作流用 GITHUB_TOKEN（pages: write）在 Pages 未启用时自动开启，
      # 并把构建来源设为 GitHub Actions，避免首次运行报 "Get Pages site failed / Not Found"。
      # 来源：https://github.com/actions/configure-pages#enablement
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: [pre-commit, backend-test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
